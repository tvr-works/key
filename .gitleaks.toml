title = "Key secret detection"

[extend]
useDefault = true

# The generic rule mistakes Swift type annotations for unquoted credentials.
# Suppress only these exact source identifiers, and only in Swift files.
[[allowlists]]
description = "Reviewed Swift type annotations and deterministic test expressions"
condition = "AND"
paths = ['''\.swift$''']
regexTarget = "secret"
regexes = [
  '''^P256\.(KeyAgreement|Signing)\.PrivateKey$''',
  '''^V3EpochSigningKeyCapsule$''',
  '''^V3HPKEWrappedVaultKey$''',
  '''^V3EnrollmentOwnerTransitionTests\.vaultKey$''',
  '''^V3LegacyMutationCompatibilityTests\.vaultKey$''',
  '''^v3MaximumSafeInteger$'''
]

[[allowlists]]
description = "Reviewed historical prose about missing or corrupt local records"
condition = "AND"
paths = ['''^docs/(history/)?piv-recovery-plan\.md$''']
regexTarget = "secret"
regexes = ['''^missing/corrupt$''']

[[allowlists]]
description = "Reviewed historical public-key comparison expressions"
condition = "AND"
paths = [
  '''^Diagnostics/signature-(vector|platform)-comparison\.swift$''',
  '''^Tests/CIScripts/secret_scanner_probe\.py$'''
]
regexTarget = "secret"
regexes = ['''^key\.x963Representation$''']
